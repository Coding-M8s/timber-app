name: Release

# Pushing a version tag such as v0.2.0 builds the app on Linux and Windows,
# each on its own platform, and puts both installers and the update files,
# with their checksums, in a draft GitHub Release. A person reviews the draft and publishes it. See
# docs/releasing.md.
#
# A pull request that changes this workflow, the version, or the dependencies
# runs the builds too, so a broken build shows before a tag is pushed. Only a
# tag makes a release.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [".github/workflows/release.yml", "scripts/check-release-tag.ts", "scripts/fetch-timber.ts", "scripts/bundled-timber-copy.ts", "electrobun.config.ts", "timber-pin.json", "package.json", "bun.lock"]

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.hutch/npm
            ~/.hutch/releases
            ~/.hutch/toolchains
          key: hutch-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - name: Check the tag against package.json
        if: startsWith(github.ref, 'refs/tags/')
        # Bash on Windows too: there the default is PowerShell, which reads
        # "$TAG" as its own empty variable.
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: bun scripts/check-release-tag.ts "$TAG"
      # The tests that list real repositories run the real Timber: the one
      # the app bundles (timber-pin.json), checked against its SHA-256.
      - name: Install Timber
        run: bun scripts/fetch-timber.ts --add-to-path
      - run: bun run typecheck
      - run: bun run typecheck:desktop
      - run: bun run test
      # A release always carries its Timber: a missing one fails the build.
      - run: bun run build
        env:
          TIMBER_APP_REQUIRE_BUNDLED_TIMBER: "1"
      # What installed apps update from: the bundle and the two update manifests
      # Electrobun's updater reads. ls fails when one is missing.
      - name: Check the update files
        shell: bash
        run: ls -l artifacts/stable-linux-x64-Timber.tar.zst artifacts/stable-linux-x64-update.json artifacts/stable-linux-x64-update-v2.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-x64
          path: |
            artifacts/linux-x64-Timber-Setup.tar.gz
            artifacts/stable-linux-x64-Timber.tar.zst
            artifacts/stable-linux-x64-update.json
            artifacts/stable-linux-x64-update-v2.json
          if-no-files-found: error

  # As in CI, Timber is not installed here, so the tests that need it are
  # skipped.
  build-windows:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Check the tag against package.json
        if: startsWith(github.ref, 'refs/tags/')
        # Bash on Windows too: there the default is PowerShell, which reads
        # "$TAG" as its own empty variable.
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: bun scripts/check-release-tag.ts "$TAG"
      - run: bun run typecheck
      - run: bun run test
      # A release always carries its Timber: a missing one fails the build.
      - run: bun run build
        env:
          TIMBER_APP_REQUIRE_BUNDLED_TIMBER: "1"
      # What installed apps update from: the bundle and the two update manifests
      # Electrobun's updater reads. ls fails when one is missing.
      - name: Check the update files
        shell: bash
        run: ls -l artifacts/stable-win-x64-Timber.tar.zst artifacts/stable-win-x64-update.json artifacts/stable-win-x64-update-v2.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: win-x64
          path: |
            artifacts/win-x64-Timber-Setup.zip
            artifacts/stable-win-x64-Timber.tar.zst
            artifacts/stable-win-x64-update.json
            artifacts/stable-win-x64-update-v2.json
          if-no-files-found: error

  # Runs only when both builds, and so all their checks, passed.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release
          merge-multiple: true
      # Installed apps download the newest published release's stable-* files
      # by name (electrobun.config.ts, release.baseUrl), so every release
      # carries them. sha256sum fails when one is missing, and then no draft
      # is made.
      - name: Write the checksums
        working-directory: release
        run: sha256sum $FILES > SHA256SUMS.txt
        env:
          FILES: >-
            linux-x64-Timber-Setup.tar.gz win-x64-Timber-Setup.zip
            stable-linux-x64-Timber.tar.zst stable-linux-x64-update.json stable-linux-x64-update-v2.json
            stable-win-x64-Timber.tar.zst stable-win-x64-update.json stable-win-x64-update-v2.json
      - name: Create the draft release
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          FILES: >-
            linux-x64-Timber-Setup.tar.gz win-x64-Timber-Setup.zip
            stable-linux-x64-Timber.tar.zst stable-linux-x64-update.json stable-linux-x64-update-v2.json
            stable-win-x64-Timber.tar.zst stable-win-x64-update.json stable-win-x64-update-v2.json
        run: |
          gh release create "$TAG" --draft --verify-tag --title "Timber $TAG" \
            --notes-file ../.github/release-notes.md --generate-notes \
            $FILES SHA256SUMS.txt
