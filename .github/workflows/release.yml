name: Release

# Pushing a version tag such as v0.2.0 builds the app on Linux and Windows,
# each on its own platform, and puts both installers with their checksums in
# a draft GitHub Release. A person reviews the draft and publishes it. See
# docs/releasing.md.
#
# A pull request that changes this workflow, the version, or the dependencies
# runs the builds too, so a broken build shows before a tag is pushed. Only a
# tag makes a release.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [".github/workflows/release.yml", "scripts/check-release-tag.ts", "package.json", "bun.lock"]

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.hutch/npm
            ~/.hutch/releases
            ~/.hutch/toolchains
          key: hutch-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - name: Check the tag against package.json
        if: startsWith(github.ref, 'refs/tags/')
        # Bash on Windows too: there the default is PowerShell, which reads
        # "$TAG" as its own empty variable.
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: bun scripts/check-release-tag.ts "$TAG"
      # The tests that list real repositories run the real Timber.
      - name: Install Timber
        env:
          TIMBER_VERSION: v0.1.3
        run: |
          curl -fsSL "https://github.com/Coding-M8s/timber/releases/download/$TIMBER_VERSION/install.sh" | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: bun run typecheck
      - run: bun run typecheck:desktop
      - run: bun test
      - run: bun run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-x64
          path: artifacts/linux-x64-Timber-Setup.tar.gz
          if-no-files-found: error

  # As in CI, Timber is not installed here, so the tests that need it are
  # skipped.
  build-windows:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Check the tag against package.json
        if: startsWith(github.ref, 'refs/tags/')
        # Bash on Windows too: there the default is PowerShell, which reads
        # "$TAG" as its own empty variable.
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: bun scripts/check-release-tag.ts "$TAG"
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: win-x64
          path: artifacts/win-x64-Timber-Setup.zip
          if-no-files-found: error

  # Runs only when both builds, and so all their checks, passed.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release
          merge-multiple: true
      - name: Write the checksums
        working-directory: release
        run: sha256sum linux-x64-Timber-Setup.tar.gz win-x64-Timber-Setup.zip > SHA256SUMS.txt
      - name: Create the draft release
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --draft --verify-tag --title "Timber $TAG" \
            --notes-file ../.github/release-notes.md --generate-notes \
            linux-x64-Timber-Setup.tar.gz win-x64-Timber-Setup.zip SHA256SUMS.txt
