name: Review status

# Marks a pull request with a failing "Requested changes" status while any
# reviewer's latest review asks for changes. The status turns green once that
# reviewer approves or the review is dismissed.
#
# The plan this repository is on cannot block a merge, so this is a warning
# only. If branch protection becomes available, make "Requested changes" a
# required status check to enforce it.
#
# The result is posted as one commit status with a fixed context, so a later
# run replaces an earlier one. Separate check runs per triggering event would
# leave a stale red entry behind after an approval.

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions:
  pull-requests: read
  statuses: write

concurrency:
  group: review-status-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  status:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Post the requested changes status
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Latest review per reviewer that approved, asked for changes, or
          # was dismissed. Plain comments do not change a reviewer's state.
          blocking=$(gh api --paginate --slurp "repos/$REPO/pulls/$PR/reviews" | jq -r '
            add // []
            | map(select(.state == "APPROVED" or .state == "CHANGES_REQUESTED" or .state == "DISMISSED"))
            | group_by(.user.login)
            | map(max_by(.submitted_at))
            | map(select(.state == "CHANGES_REQUESTED") | .user.login)
            | join(", ")')
          if [ -n "$blocking" ]; then
            state=failure
            description="Changes requested by $blocking"
          else
            state=success
            description="No outstanding change requests"
          fi
          echo "$description"
          gh api --method POST "repos/$REPO/statuses/$SHA" \
            -f state="$state" \
            -f context="Requested changes" \
            -f description="${description:0:140}" \
            -f target_url="https://github.com/$REPO/pull/$PR"
