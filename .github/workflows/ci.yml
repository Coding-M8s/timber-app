name: CI

# Pushes to a pull request branch are checked through pull_request, so push
# runs only for main. On a pull request, a newer push cancels the older run.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The suite is bound by Git, Timber, and browser processes, so it runs in
  # Bun's parallel workers and splits across three runners. tests/timings.json
  # balances the shards by measured file duration. Refresh it when test files
  # are added, removed, or get much slower or faster:
  #   bun test --parallel=4 --timeout=30000 --timings tests/timings.json --update-timings
  # (four workers, as on these runners). A file missing from it still runs.
  test:
    name: test (${{ matrix.shard }}/3)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      # The tests that list real repositories run the real Timber: the one
      # the app bundles (timber-pin.json), checked against its SHA-256.
      - name: Install Timber
        run: bun scripts/fetch-timber.ts --add-to-path
      - run: bun run test --shard=${{ matrix.shard }}/3

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build:web

  # The main ruleset requires a status named "check". It passes only when
  # every shard and the build passed; a failed, cancelled, or skipped one
  # fails it.
  check:
    needs: [test, build]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every CI job to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            test "$result" = success || { echo "A required CI job finished with: $result" >&2; exit 1; }
          done

  # Type check against the real Electrobun SDK. A separate job, so a failed
  # toolchain download does not hide the results of the check above.
  typecheck-desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.hutch/npm
            ~/.hutch/releases
            ~/.hutch/toolchains
          key: hutch-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run typecheck:desktop

  # The tests on Windows. A failure here fails the run. Timber is not
  # installed, so the tests that need the real Timber are skipped here; they
  # are run on a Windows machine with Timber installed instead, as
  # docs/verification.md records ("Run for the test suite on Windows").
  test-windows:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
