name: CI

# Pushes to a pull request branch are checked through pull_request, so push
# runs only for main. On a pull request, a newer push cancels the older run.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      # The tests that list real repositories run the real Timber.
      - name: Install Timber
        env:
          TIMBER_VERSION: v0.1.3
        run: |
          curl -fsSL "https://github.com/Coding-M8s/timber/releases/download/$TIMBER_VERSION/install.sh" | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: bun run typecheck
      - run: bun test
      - run: bun run build:web

  # Type check against the real Electrobun SDK. A separate job, so a failed
  # toolchain download does not hide the results of the check above.
  typecheck-desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.hutch/npm
            ~/.hutch/releases
            ~/.hutch/toolchains
          key: hutch-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run typecheck:desktop

  # The tests on Windows. A failure here fails the run. Timber is not
  # installed, so the tests that need the real Timber are skipped here; they
  # are run on a Windows machine with Timber installed instead, as
  # docs/verification.md records ("Run for the test suite on Windows").
  test-windows:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
