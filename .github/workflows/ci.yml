name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      # The tests that list real repositories run the real Timber.
      - name: Install Timber
        env:
          TIMBER_VERSION: v0.1.1
        run: |
          curl -fsSL "https://github.com/Coding-M8s/timber/releases/download/$TIMBER_VERSION/install.sh" | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: bun run typecheck
      - run: bun test
      - run: bun run build:web
